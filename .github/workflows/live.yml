name: US live earnings window

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Live window in minutes, 1 to 300
        default: '300'
        required: true
        type: string
      symbols:
        description: Comma-separated symbols; blank uses the complete public watchlist
        default: ''
        type: string
      handoff_slot:
        description: Two bounded handoff slots; use the opposite slot for the successor
        default: '0'
        type: choice
        options: ['0', '1']
      sec_rps:
        description: SEC rolling budget; 2 during legacy 8-rps migration, then 4 per run
        default: '2'
        type: choice
        options: ['2', '4']
      metrics_mode:
        description: Extract and compare with labelled synthetic forecasts; no exchange orders
        default: synthetic
        type: choice
        options: ['off', 'synthetic']

permissions:
  contents: write

concurrency:
  group: earnings-live-${{ inputs.handoff_slot }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the verified collector dependencies
        run: python -m pip install -r requirements.txt
      - name: Check timing and safe export offline
        run: python -m unittest -q test_probe.py
      - name: Run one real discovery window and publish safe evidence every two minutes
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          WATCH_SYMBOLS: ${{ inputs.symbols }}
          HANDOFF_SLOT: ${{ inputs.handoff_slot }}
          SEC_RPS: ${{ inputs.sec_rps }}
          METRICS_MODE: ${{ inputs.metrics_mode }}
          PYTHONUNBUFFERED: '1'
        run: python live/run_live.py --duration-minutes "$DURATION_MINUTES" --symbols "$WATCH_SYMBOLS" --handoff-slot "$HANDOFF_SLOT" --sec-rps "$SEC_RPS" --metrics-mode "$METRICS_MODE" --output live/outputs
      - name: Preserve the final safe snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-live-safe-status-${{ github.run_id }}
          path: live/outputs/latest.json
          retention-days: 1
          if-no-files-found: warn
