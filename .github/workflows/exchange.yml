name: Public exchange connectivity diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exchange:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check quote identity failures and separate handshake timing offline
        run: python -m unittest -q test_exchange_probe.py
      - name: Run one bounded public market-data diagnostic
        run: python exchange_probe.py --output outputs/exchange
      - name: Preserve original public responses and all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-exchange-diagnostic-${{ github.run_id }}
          path: outputs/exchange/
          retention-days: 1
          if-no-files-found: warn
