name: Retrieve historical development documents once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded download dependency
        run: python -m pip install httpx==0.28.1
      - name: Retrieve the static public history targets
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python history_probe.py
      - name: Preserve original responses and safe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-${{ github.run_id }}
          path: outputs/history/
          retention-days: 1
          if-no-files-found: error
