name: Public earnings document replay

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Public report subset or material-only download evidence
        type: choice
        options:
          - all
          - sec
          - sec-businesswire
          - remaining-paths
          - msgk-cache-control
          - msgk-cache-control-reverse
          - bam-pdf
          - alternate-routes
          - msgk-issuer-cold
          - msgk-browser-transport
          - msgk-production-issuer
          - repaired-paths
          - backlog-production
          - kkr-complete
          - sec-quarterly
          - lcid-http-protocols
          - lcid-chrome-protocols
          - b-sec-transports
          - skyd-materials
          - skyd-range
          - skyd-http1-material
          - skyd-complete
          - bw-browser-access
          - bw-browser-http1-access
        default: all

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified parser dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browser diagnostic dependency only for the browser scope
        if: ${{ inputs.scope == 'bw-browser-access' || inputs.scope == 'bw-browser-http1-access' }}
        run: python -m pip install playwright==1.61.0
      - name: Check continuous timing and failure evidence offline
        run: python -m unittest -q test_probe.py
      - name: Run selected report replay or material-only download once
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PROBE_SCOPE: ${{ inputs.scope }}
        run: python probe.py --output outputs --scope "$PROBE_SCOPE"
      - name: Preserve all results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-earnings-replay-${{ github.run_id }}
          path: outputs/
          retention-days: 1
          if-no-files-found: warn
