name: Public earnings document replay

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Public report subset or material-only download evidence
        type: choice
        options:
          - all
          - sec
          - sec-businesswire
          - remaining-paths
          - msgk-cache-control
          - msgk-cache-control-reverse
          - bam-pdf
          - alternate-routes
          - msgk-issuer-cold
          - msgk-browser-transport
          - msgk-production-issuer
          - repaired-paths
          - backlog-production
          - kkr-complete
          - kkr-issuer-chrome-transport
          - kkr-range-transport
          - metrics-production
          - metrics-alternate-sources
          - metrics-exchange-targets
          - metrics-22-coverage
          - metrics-unresolved-paths
          - metrics-ncmi-issuer
          - metrics-all-supported
          - metrics-kkr-complete-sources
          - sec-quarterly
          - lcid-http-protocols
          - lcid-chrome-protocols
          - b-sec-transports
          - skyd-materials
          - skyd-range
          - skyd-http1-material
          - skyd-complete
          - bw-browser-access
          - bw-browser-http1-access
        default: all
      architecture:
        description: Runner CPU architecture for this independent replay only
        type: choice
        options:
          - x64
          - arm64
        default: x64
      baseline_ref:
        description: Optional immutable baseline ref for a same-runner before/after replay
        type: string
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        if: ${{ inputs.baseline_ref != '' }}
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
          persist-credentials: false
      - name: Install verified parser dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browser diagnostic dependency only for the browser scope
        if: ${{ inputs.scope == 'bw-browser-access' || inputs.scope == 'bw-browser-http1-access' }}
        run: python -m pip install playwright==1.61.0
      - name: Check continuous timing and failure evidence offline
        run: python -m unittest -q test_probe.py
      - name: Replay immutable baseline on the same runner
        if: ${{ inputs.baseline_ref != '' }}
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PROBE_SCOPE: ${{ inputs.scope }}
        run: python baseline/probe.py --output outputs/before --scope "$PROBE_SCOPE"
      - name: Run selected report replay or material-only download once
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PROBE_SCOPE: ${{ inputs.scope }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          if [ -n "$BASELINE_REF" ]; then
            python probe.py --output outputs/after --scope "$PROBE_SCOPE"
          else
            python probe.py --output outputs --scope "$PROBE_SCOPE"
          fi
      - name: Preserve all results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-earnings-replay-${{ github.run_id }}
          path: outputs/
          retention-days: 1
          if-no-files-found: warn
